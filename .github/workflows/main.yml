name: Update Profile Stats JSON

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Fetch and Generate JSON
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_USERNAME: AnsBenO
        run: |
          cat > get-stats.js <<'EOF'
          const fs = require("fs");

          const API = "https://api.github.com";
          const GRAPHQL_API = `${API}/graphql`;

          const username = process.env.GITHUB_USERNAME;
          const token = process.env.GITHUB_TOKEN;

          const headers = {
            Authorization: `Bearer ${token}`,
            Accept: "application/vnd.github+json",
            "X-GitHub-Api-Version": "2022-11-28",
            "User-Agent": "profile-stats-updater"
          };

          async function githubRest(endpoint) {
            const response = await fetch(`${API}${endpoint}`, {
              headers
            });

            if (!response.ok) {
              const text = await response.text();

              throw new Error(
                `GitHub REST API ${response.status}: ${text}`
              );
            }

            return response.json();
          }

          async function githubGraphQL(query, variables = {}) {
            const response = await fetch(GRAPHQL_API, {
              method: "POST",
              headers: {
                ...headers,
                "Content-Type": "application/json"
              },
              body: JSON.stringify({
                query,
                variables
              })
            });

            if (!response.ok) {
              const text = await response.text();

              throw new Error(
                `GitHub GraphQL API ${response.status}: ${text}`
              );
            }

            const result = await response.json();

            if (result.errors) {
              throw new Error(
                `GraphQL Errors: ${JSON.stringify(result.errors)}`
              );
            }

            return result.data;
          }

          async function fetchUser() {
            const query = `
              query($username: String!) {
                user(login: $username) {
                  name

                  contributionsCollection {
                    commitContributionsByRepository(
                      maxRepositories: 100
                    ) {
                      repository {
                        name
                      }

                      contributions(first: 100) {
                        nodes {
                          commitCount
                          occurredAt
                          isRestricted
                        }
                      }
                    }
                  }

                  pullRequests(first: 1) {
                    totalCount
                  }

                  issues(first: 1) {
                    totalCount
                  }

                  followers {
                    totalCount
                  }

                  repositories(
                    first: 100
                    ownerAffiliations: OWNER
                    orderBy: {
                      field: STARGAZERS
                      direction: DESC
                    }
                  ) {
                    nodes {
                      name
                      url
                      description
                      stargazerCount
                      forkCount
                      isPrivate
                      isFork
                      updatedAt

                      languages(
                        first: 10
                        orderBy: {
                          field: SIZE
                          direction: DESC
                        }
                      ) {
                        edges {
                          size
                          node {
                            name
                            color
                          }
                        }
                      }
                    }
                  }
                }
              }
            `;

            return githubGraphQL(query, { username });
          }

          function getWeekStart(dateString) {
            const date = new Date(dateString);

            const day = date.getUTCDay();

            const diff = day === 0 ? -6 : 1 - day;

            date.setUTCDate(date.getUTCDate() + diff);

            return date.toISOString().split("T")[0];
          }

          function fetchWeeklyCommits(user) {
            const weekly = {};

            for (const repository of user.contributionsCollection
              .commitContributionsByRepository) {

              for (const contribution of repository.contributions.nodes) {
                const week = getWeekStart(
                  contribution.occurredAt
                );

                if (!weekly[week]) {
                  weekly[week] = 0;
                }

                weekly[week] += contribution.commitCount;
              }
            }

            return Object.entries(weekly)
              .map(([week, count]) => ({
                week,
                count
              }))
              .sort(
                (a, b) =>
                  new Date(a.week) - new Date(b.week)
              );
          }

          async function fetchWeeklyCodeFrequency(repositories) {
            const weekly = {};

            for (const repo of repositories) {
              if (repo.isPrivate || repo.isFork) {
                continue;
              }

              try {
                const response = await fetch(
                  `${API}/repos/${username}/${repo.name}/stats/code_frequency`,
                  { headers }
                );

                if (response.status === 202) {
                  console.log(
                    `Code frequency is still being calculated for ${repo.name}`
                  );

                  continue;
                }

                if (!response.ok) {
                  console.warn(
                    `Could not fetch code frequency for ${repo.name}: ${response.status}`
                  );

                  continue;
                }

                const data = await response.json();

                if (!Array.isArray(data)) {
                  continue;
                }

                for (const week of data) {
                  const timestamp = week[0];
                  const additions = week[1];
                  const deletions = Math.abs(week[2]);

                  const date = new Date(timestamp * 1000)
                    .toISOString()
                    .split("T")[0];

                  if (!weekly[date]) {
                    weekly[date] = {
                      additions: 0,
                      deletions: 0
                    };
                  }

                  weekly[date].additions += additions;
                  weekly[date].deletions += deletions;
                }
              } catch (error) {
                console.warn(
                  `Could not fetch code frequency for ${repo.name}:`,
                  error.message
                );
              }
            }

            return Object.entries(weekly)
              .map(([week, values]) => ({
                week,
                additions: values.additions,
                deletions: values.deletions
              }))
              .sort(
                (a, b) =>
                  new Date(a.week) - new Date(b.week)
              );
          }

          async function fetchStats() {
            console.log(
              `Fetching statistics for ${username}...`
            );

            const data = await fetchUser();
            const user = data.user;

            if (!user) {
              throw new Error(
                `GitHub user '${username}' not found`
              );
            }

            const profile = await githubRest(
              `/users/${username}`
            );

            let totalStars = 0;
            let totalForks = 0;

            const repositories = [];
            const languageMap = {};

            for (const repo of user.repositories.nodes) {
              totalStars += repo.stargazerCount;
              totalForks += repo.forkCount;

              repositories.push({
                name: repo.name,
                url: repo.url,
                description: repo.description,
                stars: repo.stargazerCount,
                forks: repo.forkCount,
                language:
                  repo.languages.edges[0]?.node.name || null,
                isFork: repo.isFork,
                updatedAt: repo.updatedAt
              });

              for (const lang of repo.languages.edges) {
                const name = lang.node.name;

                languageMap[name] =
                  (languageMap[name] || 0) + lang.size;
              }
            }

            console.log(
              "Fetching weekly additions/deletions..."
            );

            const weeklyCodeFrequency =
              await fetchWeeklyCodeFrequency(
                user.repositories.nodes
              );

            console.log(
              "Fetching weekly commit activity..."
            );

            const weeklyCommits =
              fetchWeeklyCommits(user);

            const stats = {
              username,
              name: user.name,

              followers: user.followers.totalCount,
              following: profile.following,
              publicRepositories: profile.public_repos,

              commits: weeklyCommits,

              prs: user.pullRequests.totalCount,
              issues: user.issues.totalCount,

              stars: totalStars,
              forks: totalForks,

              repositories,

              codeActivity: weeklyCodeFrequency,

              languages: Object.entries(languageMap)
                .map(([name, size]) => ({
                  name,
                  size
                }))
                .sort((a, b) => b.size - a.size)
            };

            fs.writeFileSync(
              "stats.json",
              JSON.stringify(stats, null, 2) + "\n"
            );

            console.log("Generated stats.json:");
            console.log(JSON.stringify(stats, null, 2));
          }

          fetchStats().catch((error) => {
            console.error(error);
            process.exit(1);
          });
          EOF

          node get-stats.js
          rm get-stats.js

      - name: Commit and Push Changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add stats.json

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "chore: update profile stats JSON [skip ci]"
          git push
