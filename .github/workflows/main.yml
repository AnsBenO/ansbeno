name: Update Profile Stats JSON

on:
  schedule:
    - cron: '0 */12 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Fetch and Generate JSON
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_USERNAME: AnsBenO
        run: |
          cat << 'EOF' > get-stats.js
          const fs = require('fs');

          async function fetchStats() {
            const query = `
              query($username: String!) {
                user(login: $username) {
                  name

                  contributionsCollection {
                    totalCommitContributions
                    restrictedContributionsCount
                  }

                  pullRequests(first: 1) {
                    totalCount
                  }

                  issues(first: 1) {
                    totalCount
                  }

                  followers {
                    totalCount
                  }

                  repositoriesContributedTo(first: 1) {
                    totalCount
                  }

                  repositories(
                    first: 100
                    ownerAffiliations: OWNER
                    orderBy: {
                      field: STARGAZERS
                      direction: DESC
                    }
                  ) {
                    nodes {
                      stargazers {
                        totalCount
                      }

                      forkCount

                      languages(
                        first: 5
                        orderBy: {
                          field: SIZE
                          direction: DESC
                        }
                      ) {
                        edges {
                          size
                          node {
                            name
                            color
                          }
                        }
                      }
                    }
                  }
                }
              }
            `;

            const username = process.env.GITHUB_USERNAME;

            const response = await fetch(
              'https://api.github.com/graphql',
              {
                method: 'POST',
                headers: {
                  'Authorization': `Bearer ${process.env.GITHUB_TOKEN}`,
                  'Content-Type': 'application/json',
                  'User-Agent': 'profile-stats-updater'
                },
                body: JSON.stringify({
                  query,
                  variables: { username }
                })
              }
            );

            if (!response.ok) {
              const text = await response.text();
              throw new Error(
                `GitHub API responded with status ${response.status}: ${text}`
              );
            }

            const result = await response.json();

            if (result.errors) {
              throw new Error(
                `GraphQL Errors: ${JSON.stringify(result.errors)}`
              );
            }

            if (!result.data?.user) {
              throw new Error(`GitHub user '${username}' not found`);
            }

            const user = result.data.user;

            let totalStars = 0;
            let totalForks = 0;
            const languageMap = {};

            for (const repo of user.repositories.nodes) {
              totalStars += repo.stargazers.totalCount;
              totalForks += repo.forkCount;

              for (const lang of repo.languages.edges) {
                const name = lang.node.name;

                languageMap[name] =
                  (languageMap[name] || 0) + lang.size;
              }
            }

            const stats = {
              username,
              name: user.name,
              commits:
                user.contributionsCollection.totalCommitContributions +
                user.contributionsCollection.restrictedContributionsCount,
              prs: user.pullRequests.totalCount,
              issues: user.issues.totalCount,
              stars: totalStars,
              forks: totalForks,
              followers: user.followers.totalCount,
              languages: Object.entries(languageMap)
                .map(([name, size]) => ({
                  name,
                  size
                }))
                .sort((a, b) => b.size - a.size)
            };

            fs.writeFileSync(
              'stats.json',
              JSON.stringify(stats, null, 2) + '\\n'
            );

            console.log('Generated stats.json');
            console.log(stats);
          }

          fetchStats().catch(err => {
            console.error(err);
            process.exit(1);
          });
          EOF

          node get-stats.js
          rm get-stats.js

      - name: Commit and Push Changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add stats.json

          git diff --cached --quiet && exit 0

          git commit -m "chore: update profile stats JSON [skip ci]"
          git push
